name: Basic Security Notification

# Removed paths-ignore to avoid GitHub parser bugs on the initial commit.
# The check is safely handled by the internal Guard step below.
on:
  push:
    branches:
      - main

jobs:
  notify-business:
    name: Send Teams Notification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. THE GUARD: Physically check the folder content
      - name: Check for actual application code
        id: guard
        run: |
          # Find files, but IGNORE system folders (.git, .github, .bolton) and READMEs
          FILES=$(find . -type f -not -path "*/\.git/*" -not -path "*/\.github/*" -not -path "*/\.bolton/*" -not -name "README*.md")
          
          if [ -z "$FILES" ]; then
            echo "No application code found (likely repo creation from template). Stopping here."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Application code found. Proceeding with the notification."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # 3. Send the notification ONLY if the guard found application files
      - name: Send notification to Teams
        if: steps.guard.outputs.proceed == 'true'
        shell: bash
        env:
          WEBHOOK: ${{ secrets.MS_TEAMS_WEBHOOK_URI }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          # Build the direct URL to the repository's Security tab
          SECURITY_URL="${SERVER}/${REPO}/security"
          
          SUMMARY="New code has been pushed to the **${REPO}** repository.<br><br>👉 [Go to the Security dashboard to review](${SECURITY_URL})"
          
          echo "Sending Teams notification..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "{
              \"@type\": \"MessageCard\",
              \"@context\": \"http://schema.org/extensions\",
              \"themeColor\": \"0076D7\",
              \"summary\": \"New code pushed\",
              \"text\": \"${SUMMARY}\"
            }")
          
          echo "Teams response: HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -ge 400 ]; then
            echo "::error::Teams notification failed (HTTP ${HTTP_CODE}). Check the Webhook URI."
            exit 1
          fi
