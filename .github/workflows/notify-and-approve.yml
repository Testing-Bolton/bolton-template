name: Basic Security Notification

# Rimosso paths-ignore per evitare il bug di GitHub al primo commit.
# Il controllo viene gestito in modo sicuro dallo step di Guardia interno.
on:
  push:
    branches:
      - main

jobs:
  notify-business:
    name: Invia Notifica Teams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. LA GUARDIA: Controlla fisicamente il contenuto della cartella
      - name: Controlla se c'è codice vero
        id: guard
        run: |
          # Cerca i file, ma IGNORA tutto ciò che è cartella di sistema (.git, .github) o README
          FILES=$(find . -type f -not -path "*/\.git/*" -not -path "*/\.github/*" -not -path "*/\.bolton/*" -not -name "README*.md")
          
          if [ -z "$FILES" ]; then
            echo "Nessun codice applicativo trovato (creazione repo da template). Mi fermo."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Codice applicativo trovato. Procediamo con la notifica."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # 3. Invia la notifica SOLO se la guardia ha trovato file applicativi
      - name: Send notification to Teams
        if: steps.guard.outputs.proceed == 'true'
        shell: bash
        env:
          WEBHOOK: ${{ secrets.MS_TEAMS_WEBHOOK_URI }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          # Costruisce l'URL diretto alla tab Security della repository creata
          SECURITY_URL="${SERVER}/${REPO}/security"
          
          SUMMARY="È stato caricato nuovo codice nel repository **${REPO}**.<br><br>👉 [Vai alla dashboard di Security per i controlli](${SECURITY_URL})"
          
          echo "Invio notifica a Teams..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "{
              \"@type\": \"MessageCard\",
              \"@context\": \"http://schema.org/extensions\",
              \"themeColor\": \"0076D7\",
              \"summary\": \"Nuovo caricamento codice\",
              \"text\": \"${SUMMARY}\"
            }")
          
          echo "Risposta Teams: HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -ge 400 ]; then
            echo "::error::Notifica Teams non riuscita (HTTP ${HTTP_CODE}). Controlla il Webhook URI."
            exit 1
          fi
