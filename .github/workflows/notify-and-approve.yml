name: Business Check + Security Gate

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '.bolton/**'
      - 'README*.md'

permissions:
  contents: write
  security-events: write
  actions: read

jobs:
  # ===========================================================================
  # 0) GUARDIA - Controlla se c'è codice vero o solo scaffolding
  # ===========================================================================
  guard:
    name: Check if real code exists
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      
      - id: check
        name: Verifica presenza file applicativi
        run: |
          FILES=$(find . -type f -not -path "*/\.git/*" -not -path "*/\.github/*" -not -path "*/\.bolton/*" -not -name "README*.md")
          if [ -n "$FILES" ]; then
            echo "Trovato codice applicativo vero. Procediamo."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Trovati solo file di template o repo vuota. Mi fermo."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  # ===========================================================================
  # 1) ANALISI DI SICUREZZA
  # ===========================================================================
  code-scanning:
    name: CodeQL Analysis (Python)
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  # ===========================================================================
  # 2) RILEVAMENTO PRIMA VOLTA
  # ===========================================================================
  check-first-run:
    name: Check if this is first run
    runs-on: ubuntu-latest
    needs: code-scanning
    outputs:
      is_first_run: ${{ steps.check.outputs.first_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if this is first run
        id: check
        run: |
          if [ -f ".github/.approved" ]; then
            echo "first_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "first_run=true" >> "$GITHUB_OUTPUT"
          fi

  # ===========================================================================
  # 3) RACCOLTA ESITO GHAS + NOTIFICA TEAMS
  # ===========================================================================
  notify-business:
    name: Notify business team
    runs-on: ubuntu-latest
    needs: check-first-run
    if: needs.check-first-run.outputs.is_first_run == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Collect GHAS alert counts
        id: ghas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CODE_ALERTS=$(gh api "repos/${{ github.repository }}/code-scanning/alerts?state=open" --jq 'length' 2>/dev/null || echo "")
          SECRET_ALERTS=$(gh api "repos/${{ github.repository }}/secret-scanning/alerts?state=open" --jq 'length' 2>/dev/null || echo "")
          echo "code_alerts=$CODE_ALERTS" >> "$GITHUB_OUTPUT"
          echo "secret_alerts=$SECRET_ALERTS" >> "$GITHUB_OUTPUT"

      - name: Send notification to Teams
        shell: bash
        env:
          WEBHOOK: ${{ secrets.MS_TEAMS_WEBHOOK_URI }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER: ${{ github.server_url }}
          CODE_ALERTS: ${{ steps.ghas.outputs.code_alerts }}
          SECRET_ALERTS: ${{ steps.ghas.outputs.secret_alerts }}
        run: |
          REPO_URL="${SERVER}/${REPO}"
          APPROVAL_URL="${REPO_URL}/actions/runs/${RUN_ID}"
          SECURITY_URL="${REPO_URL}/security"

          if [ -z "$CODE_ALERTS" ] && [ -z "$SECRET_ALERTS" ]; then
            SEC_LINE="Esito non ancora disponibile: vedi il report completo"
          else
            SEC_LINE="Code scanning: ${CODE_ALERTS:-n/d} alert aperti · Secret scanning: ${SECRET_ALERTS:-n/d} alert aperti"
          fi

          SUMMARY="New repository **${REPO}** requires business approval.<br><br>${SEC_LINE}<br><br>[Approve here](${APPROVAL_URL})<br>[View security report](${SECURITY_URL})"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${WEBHOOK}" -H "Content-Type: application/json" -d "{ \"@type\": \"MessageCard\", \"@context\": \"http://schema.org/extensions\", \"themeColor\": \"ffc107\", \"summary\": \"Business approval required\", \"text\": \"${SUMMARY}\" }")
          
          if [ "${HTTP_CODE}" -ge 400 ]; then
            echo "::warning::Notifica Teams non riuscita (HTTP ${HTTP_CODE})."
          fi

      - name: Setup business-approval environment
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          curl -L --fail -X PUT -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/orgs/${{ github.repository_owner }}/teams/repo-approvers/repos/${{ github.repository }}" -d '{"permission":"push"}'
          curl -L --fail -X PUT -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/environments/business-approval" -d '{"reviewers": [{"type":"Team","id":18113363}]}'

  # ===========================================================================
  # 4) GATE DI APPROVAZIONE E BUILD
  # ===========================================================================
  business-approval:
    name: Wait for approval
    runs-on: ubuntu-latest
    needs: [check-first-run, notify-business]
    if: needs.check-first-run.outputs.is_first_run == 'true'
    environment: business-approval
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write approval marker
        run: |
          echo "Approved on $(date)" > .github/.approved
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/.approved
          git commit -m "repository marked as approved [skip ci]"
          git push

  build-and-tag:
    name: Build & Tag
    runs-on: ubuntu-latest
    needs: [check-first-run, business-approval, code-scanning]
    if: always() && needs.code-scanning.result == 'success' && (needs.check-first-run.outputs.is_first_run == 'false' || needs.business-approval.result == 'success')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "Building application... (placeholder)"
